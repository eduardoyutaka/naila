      maintenance: Manutenção
      inactive: Inativo
    user_role:
      admin: Administrador
      coordinator: Coordenador
      operator: Operador
    notification_channel:
      email: Email
      sms: SMS
    data_source_status:
      active: Online
      degraded: Degradado
      offline: Offline
    comparison_operator_label:
      GreaterThanThreshold: Maior que
      GreaterThanOrEqualToThreshold: Maior ou igual
      LessThanThreshold: Menor que
      LessThanOrEqualToThreshold: Menor ou igual
  # Grammatical gender/verb-form varies by noun in Portuguese (Ativo vs Ativa vs Ativado/
  # Ativada) — these can't share one generic "enabled" key, so each gets its own, using
  # enabled/disabled as keys (NOT true/false — YAML parses bare true/false/yes/no as
  # booleans even as hash keys, breaking dotted-path t() lookups).
  booleans:
    monitoring_station_active:
      enabled: Ativo
      disabled: Inativo
    river_basin_active:
      enabled: Ativa
      disabled: Inativa
    user_active:
      enabled: Ativo
      disabled: Inativo
    alarm_enabled:
      enabled: Ativado
      disabled: Desativado
    alarm_action_enabled:
      enabled: Ativada
      disabled: Desativada
    notification_rule_enabled:
      enabled: Ativada
      disabled: Desativada
  labels:
    not_monitored: Não monitorada
    insufficient_data_badge: Dados insuficientes
    connected_stale: Conectado (sem leitura recente)
    role_plural:
      admin: Administradores
      coordinator: Coordenadores
      operator: Operadores
  errors:
