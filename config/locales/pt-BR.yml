      weather_station: Meteorológica
    connection_status:
      unknown: Sem dados
      connected: Conectado
      disconnected: Desconectado
    statistic:
      Average: Média
      Sum: Soma
      Minimum: Mínimo
      Maximum: Máximo
      SampleCount: Contagem de Amostras
    alarm_state:
      ok: OK
      alarm: Alarme
      insufficient_data: Dados Insuficientes
    missing_data_treatment:
      missing: Ausente
      notBreaching: Não viola
      breaching: Viola
